name: Validate Workspace Bootstrap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS / POSIX bootstrap
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout canonical agent guidance
        uses: actions/checkout@v5
        with:
          repository: ChecheRomo96/RoModularAgents
          path: .ci-workspace/RoModularAgents

      - name: Validate shell syntax
        shell: bash
        run: sh -n scripts/bootstrap-workspace.sh

      - name: Configure test workspace
        shell: bash
        run: |
          ./scripts/bootstrap-workspace.sh \
            --root "$GITHUB_WORKSPACE/.ci-workspace" \
            --manifest "$GITHUB_WORKSPACE/.github/testdata/agent-workspace.txt"

      - name: Verify idempotent configuration
        shell: bash
        run: |
          ./scripts/bootstrap-workspace.sh \
            --root "$GITHUB_WORKSPACE/.ci-workspace" \
            --manifest "$GITHUB_WORKSPACE/.github/testdata/agent-workspace.txt"

      - name: Install Arduino libraries twice
        shell: bash
        run: |
          sh -n scripts/install-arduino-libraries.sh
          ./scripts/install-arduino-libraries.sh "$RUNNER_TEMP/arduino-libraries"
          ./scripts/install-arduino-libraries.sh "$RUNNER_TEMP/arduino-libraries"
          test -f "$RUNNER_TEMP/arduino-libraries/Foundation/library.properties"
          test -f "$RUNNER_TEMP/arduino-libraries/DspCore/library.properties"
          test -f "$RUNNER_TEMP/arduino-libraries/MCC/library.properties"
          test -f "$RUNNER_TEMP/arduino-libraries/MIDILAR/library.properties"
          test "$(git -C "$RUNNER_TEMP/arduino-libraries/MIDILAR" rev-parse --abbrev-ref HEAD)" = main

  windows:
    name: Windows / PowerShell bootstrap
    runs-on: windows-2025-vs2026
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout canonical agent guidance
        uses: actions/checkout@v5
        with:
          repository: ChecheRomo96/RoModularAgents
          path: .ci-workspace/RoModularAgents

      - name: Configure test workspace
        shell: pwsh
        run: |
          ./scripts/bootstrap-workspace.ps1 `
            -Root (Join-Path $env:GITHUB_WORKSPACE ".ci-workspace") `
            -Manifest (Join-Path $env:GITHUB_WORKSPACE ".github/testdata/agent-workspace.txt")

      - name: Verify idempotent configuration
        shell: pwsh
        run: |
          ./scripts/bootstrap-workspace.ps1 `
            -Root (Join-Path $env:GITHUB_WORKSPACE ".ci-workspace") `
            -Manifest (Join-Path $env:GITHUB_WORKSPACE ".github/testdata/agent-workspace.txt")

      - name: Install Arduino libraries twice
        shell: pwsh
        run: |
          $Libraries = Join-Path $env:RUNNER_TEMP "arduino-libraries"
          ./scripts/install-arduino-libraries.ps1 $Libraries
          ./scripts/install-arduino-libraries.ps1 $Libraries
          foreach ($Library in "Foundation", "DspCore", "MCC", "MIDILAR") {
            if (-not (Test-Path (Join-Path $Libraries "$Library/library.properties"))) {
              throw "$Library was not installed"
            }
          }
          $Branch = (& git -C (Join-Path $Libraries "MIDILAR") rev-parse --abbrev-ref HEAD)
          if ($Branch -ne "main") {
            throw "MIDILAR is on '$Branch' instead of main"
          }

      - name: Install Arduino libraries from Git Bash with a drive path
        shell: bash
        run: |
          LIBRARIES=$(cygpath -w "$RUNNER_TEMP/arduino-libraries-bash")
          ./scripts/install-arduino-libraries.sh "$LIBRARIES"
          test -f "$RUNNER_TEMP/arduino-libraries-bash/MCC/library.properties"
